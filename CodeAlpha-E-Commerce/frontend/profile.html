<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Account Profile — ApexBazaar</title>
  <link rel="icon" type="image/png" href="/Favicon.png" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>

  <!-- Injected Shared Header -->
  <header id="global-header"></header>

  <main class="apx-container" style="margin-top: 30px; min-height: 75vh;">
    
    <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
      <a href="/index.html" style="hover:color:var(--primary)">Home</a> / 
      <span style="color: var(--text-main)">My Account</span>
    </div>

    <div class="profile-layout-grid">
      <!-- Left: Sidebar Navigation -->
      <aside class="apx-glass profile-sidebar">
        <div class="profile-sidebar-user">
          <div class="avatar-upload-wrapper">
            <img id="sidebar-avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" class="sidebar-avatar" alt="Avatar" />
            <label class="avatar-upload-btn" for="avatar-input">📷</label>
            <input type="file" id="avatar-input" accept="image/*" style="display: none;" />
          </div>
          <div>
            <div class="sidebar-username" id="sidebar-username">My Account</div>
            <div class="sidebar-email" id="sidebar-email">Manage your settings</div>
          </div>
        </div>

        <nav style="display:flex; flex-direction:column; gap:8px;">
          <button class="profile-nav-btn active" data-tab="tab-settings">👤 Account Settings</button>
          <button class="profile-nav-btn" data-tab="tab-orders">📦 Order History</button>
          <button class="profile-nav-btn" data-tab="tab-password">🔑 Change Password</button>
        </nav>
      </aside>

      <!-- Right: Main Details Content Panel -->
      <section class="profile-details-column">
        
        <!-- Tab 1: Settings -->
        <div id="tab-settings" class="profile-tab-content active">
          <div class="apx-glass" style="padding: 30px; margin-bottom: 24px;">
            <h3 style="font-size: 1.3rem; margin-bottom: 20px; color:#fff; border-bottom: 1px solid var(--border-color); padding-bottom:10px;">Update Profile Information</h3>
            
            <form id="update-profile-form">
              <div class="profile-form-grid">
                <div>
                  <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Full Name</label>
                  <input type="text" id="profile-name" class="apx-input" style="width:100%;" required />
                </div>
                <div>
                  <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Phone Number</label>
                  <input type="tel" id="profile-phone" class="apx-input" style="width:100%;" />
                </div>
                <div>
                  <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Gender</label>
                  <select id="profile-gender" class="apx-input" style="width:100%;">
                    <option value="">Select</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>
                    <option value="PREFER_NOT_TO_SAY">Prefer not to say</option>
                  </select>
                </div>
                <div>
                  <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Date of Birth</label>
                  <input type="date" id="profile-dob" class="apx-input" style="width:100%;" />
                </div>
              </div>
              <div style="margin-bottom: 20px;">
                <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Bio</label>
                <textarea id="profile-bio" class="apx-input" style="width:100%; min-height: 100px; resize: vertical;"></textarea>
              </div>
              <div style="margin-bottom: 20px;">
                <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Email Address (Cannot change)</label>
                <input type="email" id="profile-email" class="apx-input" style="width:100%; opacity:0.6;" readonly />
              </div>
              <button type="submit" class="apx-btn apx-btn-primary" style="padding: 10px 20px; font-size: 0.85rem;">Update Profile</button>
            </form>
          </div>

          <div class="apx-glass" style="padding: 30px;">
            <h3 style="font-size: 1.3rem; margin-bottom: 20px; color:#fff; border-bottom: 1px solid var(--border-color); padding-bottom:10px;">Saved Address Book</h3>
            <div id="saved-addresses-list">
              <!-- Loaded dynamically -->
            </div>
          </div>
        </div>

        <!-- Tab 2: Orders -->
        <div id="tab-orders" class="profile-tab-content">
          <h3 style="font-size: 1.4rem; color: #fff; margin-bottom: 20px;">Order History & Tracking</h3>
          <div id="orders-history-container">
            <!-- Loaded dynamically -->
          </div>
        </div>

        <!-- Tab 3: Password -->
        <div id="tab-password" class="profile-tab-content">
          <div class="apx-glass" style="padding: 30px; max-width: 600px;">
            <h3 style="font-size: 1.3rem; margin-bottom: 20px; color:#fff; border-bottom: 1px solid var(--border-color); padding-bottom:10px;">Security Credentials</h3>
            
            <form id="update-password-form" style="display:flex; flex-direction:column; gap:16px;">
              <div>
                <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Current Password</label>
                <input type="password" id="current-password" class="apx-input" placeholder="••••••••" style="width:100%;" required />
              </div>
              <div>
                <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">New Password</label>
                <input type="password" id="new-password" class="apx-input" placeholder="Min. 6 chars" style="width:100%;" required />
              </div>
              <div>
                <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Confirm New Password</label>
                <input type="password" id="confirm-new-password" class="apx-input" placeholder="••••••••" style="width:100%;" required />
              </div>
              <button type="submit" class="apx-btn apx-btn-primary" style="padding: 10px 20px; font-size: 0.85rem; align-self:start;">Change Password</button>
            </form>
          </div>
        </div>

      </section>
    </div>

  </main>

  <!-- Injected Shared Footer -->
  <footer id="global-footer"></footer>

  <!-- Scripts -->
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/profilePage.js"></script>
</body>
</html>
