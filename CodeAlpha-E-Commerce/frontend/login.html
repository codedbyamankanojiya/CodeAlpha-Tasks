<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In to ApexBazaar</title>
  <link rel="icon" type="image/png" href="/Favicon.png" />
  <link rel="stylesheet" href="/src/css/styles.css" />
</head>
<body>

  <!-- Injected Shared Header -->
  <header id="global-header"></header>

  <main class="apx-container" style="display:flex; align-items:center; justify-content:center; min-height: 75vh; padding: 40px 20px;">
    
    <div class="apx-glass" style="max-width: 450px; width: 100%; padding: 40px 30px;">
      <h2 style="font-size: 1.8rem; font-family: var(--font-heading); color:#fff; text-align:center; margin-bottom: 8px;">Welcome Back</h2>
      <p style="color:var(--text-muted); text-align:center; font-size:0.9rem; margin-bottom: 30px;">Sign in to your ApexBazaar account to continue</p>
      
      <form id="login-form" style="display:flex; flex-direction:column; gap:16px;">
        <!-- Email -->
        <div>
          <label for="login-email" style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Email Address</label>
          <input type="email" id="login-email" class="apx-input" placeholder="you@example.com" style="width:100%;" required />
        </div>
        
        <!-- Password -->
        <div>
          <label for="login-password" style="display:block; font-size:0.85rem; font-weight:700; margin-bottom: 6px;">Password</label>
          <input type="password" id="login-password" class="apx-input" placeholder="••••••••" style="width:100%;" required />
        </div>

        <!-- Remember me -->
        <div style="display:flex; align-items:center; justify-content:space-between; font-size:0.85rem; margin-top: 4px;">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="login-remember" style="accent-color: var(--primary);" />
            Remember me
          </label>
          <a href="#" style="color:var(--primary);" onclick="alert('Password reset link sent to email (Mock Workflow)!')">Forgot password?</a>
        </div>

        <button type="submit" class="apx-btn apx-btn-primary" style="width:100%; height:46px; margin-top: 10px; font-size: 0.95rem;">Sign In</button>
      </form>

      <div style="text-align:center; font-size:0.85rem; margin-top: 24px; color:var(--text-muted);">
        Don't have an account? <a href="/signup.html" style="color:var(--primary); font-weight:600;">Create one here</a>
      </div>
    </div>

  </main>

  <!-- Injected Shared Footer -->
  <footer id="global-footer"></footer>

  <!-- Scripts -->
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/authPages.js"></script>
</body>
</html>
